name: pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-stage:                      # R3: result within 10 minutes
    name: commit-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }     # full history, so that new code can be told from old
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: maven }

      - name: Build and unit tests
        run: ./mvnw -B verify -Dtest='*Tests,*Test,!*IntegrationTests'

      - name: Code analysis and quality gate (SonarQube Cloud)
        if: ${{ env.SONAR_TOKEN != '' }}          # skipped until the token exists
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORG }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true

      - name: Install Snyk
        if: ${{ env.SNYK_TOKEN != '' }}           # skipped until the token exists
        uses: snyk/actions/setup@master
      - name: Dependency scan (Snyk)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk test --severity-threshold=high

  integration-tests:                 # in parallel; real databases in containers
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Integration tests
        run: ./mvnw -B verify -Dtest='*IntegrationTests'

  package:                           # R2: the image is built once, after the merge
    name: package
    if: github.event_name == 'push'
    needs: [commit-stage, integration-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: maven }

      - name: Build the application package
        run: ./mvnw -B package -DskipTests

      - name: Build the Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$IMAGE" .

      - name: Smoke test, the container has to report healthy
        run: |
          docker run -d --name app -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fs localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Healthy after about $((i * 4)) seconds"
              exit 0
            fi
            sleep 4
          done
          docker logs app
          exit 1

      - name: Push the image to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          echo "Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:                    # stages 3 to 5 in small: deploy, check, roll back
    name: deploy-staging
    if: github.event_name == 'push'
    needs: [package]
    runs-on: ubuntu-24.04
    environment: staging             # GitHub records every deployment (R5)
    permissions:
      contents: read
      packages: write
    services:
      postgres:                      # stands in for the production database
        image: postgres:18.4
        env:
          POSTGRES_DB: petclinic
          POSTGRES_USER: petclinic
          POSTGRES_PASSWORD: staging-db-password   # sample value; a real one would be a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petclinic" --health-interval 5s --health-retries 10
    env:
      DB_PASS: staging-db-password
    steps:
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Name the images
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$REPO:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "STABLE=$REPO:stable" >> "$GITHUB_ENV"

      - name: Deploy the new version
        id: deploy
        run: |
          start_and_check() {
            docker rm -f app >/dev/null 2>&1 || true
            docker run -d --name app --network host \
              -e SPRING_PROFILES_ACTIVE=postgres \
              -e POSTGRES_URL=jdbc:postgresql://localhost:5432/petclinic \
              -e POSTGRES_USER=petclinic -e POSTGRES_PASS="$DB_PASS" "$1"
            for i in $(seq 1 30); do
              if curl -fs localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                curl -fsL "localhost:8080/owners?lastName=Franklin" | grep -q "George Franklin" && return 0
              fi
              sleep 4
            done
            return 1
          }
          declare -f start_and_check > "$RUNNER_TEMP/deploy.sh"
          source "$RUNNER_TEMP/deploy.sh"
          start_and_check "$IMAGE"
          echo "The new version ${GITHUB_SHA::7} passed the health check and the smoke test."

      - name: Mark the version as stable
        run: |
          docker tag "$IMAGE" "$STABLE"
          docker push "$STABLE"
          echo "Deployed \`${GITHUB_SHA::7}\` to staging. It is now the stable version." >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to the last stable version
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "Last lines of the failed version's log:"
          docker logs app 2>&1 | grep -iE "error|fatal|exception" | tail -n 5 || true
          source "$RUNNER_TEMP/deploy.sh"
          docker pull "$STABLE"
          start_and_check "$STABLE"
          OLD=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$STABLE")
          {
            echo "Deployment of \`${GITHUB_SHA::7}\` failed the health check."
            echo ""
            echo "Rolled back to the stable version \`${OLD::7}\`, which passed the health check and the smoke test."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Rolled back to ${OLD::7}."
