name: release

# Stage 6 of the design: a release is separate from a deployment.
# The workflow decides, from the calendar in the repository, for which institutions
# the flag may be switched on today, writes that decision into a flag file, and asks
# the current stable version of the application what each institution now sees.

on:
  workflow_dispatch:
    inputs:
      flag:
        description: Feature flag to switch on
        type: string
        required: true
      group:
        description: Who receives it
        type: choice
        options: [pilots, all]
        default: pilots

permissions:
  contents: read
  packages: read

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    environment: release             # required reviewer: the product owner
    env:
      FLAG: ${{ inputs.flag }}
      GROUP: ${{ inputs.group }}
    steps:
      - uses: actions/checkout@v6
      - name: Decide per institution from the calendar
        run: |
          python3 - <<'PY'
          import datetime, json, os

          flag, group = os.environ["FLAG"], os.environ["GROUP"]
          today = datetime.date.today()
          with open("calendar/sensitive-periods.json") as f:
              calendar = json.load(f)

          rows = []
          for inst in calendar["institutions"]:
              if group == "pilots" and not inst.get("pilot"):
                  continue
              frozen = [p for p in inst["sensitive_periods"]
                        if datetime.date.fromisoformat(p["from"]) <= today
                        <= datetime.date.fromisoformat(p["to"])]
              if frozen:
                  p = frozen[0]
                  rows.append((inst["name"], "waits", f'{p["reason"]} until {p["to"]}'))
              else:
                  rows.append((inst["name"], "switched on", ""))

          lines = [f"## Release of `{flag}` to {group} on {today}", "",
                   "| Institution | Flag | Reason |", "|---|---|---|"]
          lines += [f"| {n} | {s} | {r} |" for n, s, r in rows]
          on = sum(1 for _, s, _ in rows if s == "switched on")
          lines += ["", f"{on} of {len(rows)} institutions receive the feature today."]
          text = "\n".join(lines)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(text + "\n")
          with open("flags.properties", "w") as f:
              f.write(flag + "=" + ", ".join(n for n, st, _ in rows if st == "switched on") + "\n")
          with open("institutions.txt", "w") as f:
              f.write("\n".join(n for n, _, _ in rows) + "\n")
          PY

      - name: Switch the flag in the running application
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          STABLE="ghcr.io/${GITHUB_REPOSITORY,,}:stable"
          docker run -d --name app -p 8080:8080 \
            -v "$PWD/flags.properties:/flags/flags.properties:ro" \
            -e FLAGS_FILE=/flags/flags.properties "$STABLE"
          for i in $(seq 1 30); do
            curl -fs localhost:8080/actuator/health | grep -q '"status":"UP"' && break
            sleep 4
          done
          VERSION=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$STABLE")
          echo "Flag file written by this release:"
          cat flags.properties
          {
            echo ""
            echo "## What the running application answers"
            echo ""
            echo "Stable version \`${VERSION::7}\`, asked once per institution whether \`$FLAG\` is on."
            echo ""
            echo "| Institution | Answer of the application |"
            echo "|---|---|"
            while IFS= read -r name; do
              answer=$(curl -fs -H "X-Institution: $name" "localhost:8080/flags/$FLAG")
              echo "| $name | $answer |"
            done < institutions.txt
          } >> "$GITHUB_STEP_SUMMARY"
